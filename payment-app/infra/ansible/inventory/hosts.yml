---
# ============================================================================
# Ansible Inventory for Payment Application
# ============================================================================
# This inventory defines the OpenShift cluster connection details.
#
# Configuration:
# - Single OpenShift cluster with 5 worker nodes
# - Two namespaces: bob-demo-staging and bob-demo-prod
# - Uses OpenShift CLI (oc) for authentication
#
# Prerequisites:
# - OpenShift CLI (oc) must be installed
# - User must be logged in: oc login <cluster-url> --token=<token>
# - kubernetes.core Ansible collection must be installed:
#   ansible-galaxy collection install kubernetes.core
#
# Environment Variables:
# - OPENSHIFT_SERVER: OpenShift cluster API URL
# - OPENSHIFT_TOKEN: Authentication token
# - K8S_AUTH_VERIFY_SSL: Set to 'no' for self-signed certificates (optional)
# ============================================================================

all:
  children:
    openshift:
      children:
        openshift_cluster:
          hosts:
            localhost:
              ansible_connection: local
              ansible_python_interpreter: "{{ ansible_playbook_python }}"
              
              # OpenShift cluster connection details
              # These can be overridden via environment variables or command line
              k8s_host: "{{ lookup('env', 'OPENSHIFT_SERVER') | default('https://api.cluster.example.com:6443') }}"
              k8s_api_key: "{{ lookup('env', 'OPENSHIFT_TOKEN') | default('') }}"
              k8s_validate_certs: "{{ lookup('env', 'K8S_AUTH_VERIFY_SSL') | default('yes') }}"
              
              # Cluster information
              cluster_name: "openshift-cluster"
              cluster_worker_nodes: 5
              cluster_worker_cpu: 16
              cluster_worker_memory: 64
              
              # Namespace groups for targeted execution
              staging_namespace: bob-demo-staging
              prod_namespace: bob-demo-prod

  vars:
    # Global variables for all hosts
    ansible_python_interpreter: /usr/bin/python3
    
    # Kubernetes/OpenShift module defaults
    k8s_state: present
    k8s_wait: true
    k8s_wait_timeout: 300
    
    # Application metadata
    app_name: payment-application
    app_component: payment-service
    managed_by: ansible

# ============================================================================
# Host Groups for Targeted Execution
# ============================================================================
# You can target specific environments using --limit:
#
# Run on staging only:
#   ansible-playbook -i inventory/hosts.yml playbook.yml --limit staging
#
# Run on production only:
#   ansible-playbook -i inventory/hosts.yml playbook.yml --limit prod
#
# Run on all environments (default):
#   ansible-playbook -i inventory/hosts.yml playbook.yml
# ============================================================================

